<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Formato de texto e hipervínculos</title>
    <link rel="stylesheet" href="estilos2.css">
</head>
<body>

    <!-- Encabezado h1 predeterminado -->
    <h1>Esto es un encabezado h1</h1>

    <!-- Encabezado h2 con estilo cursiva y rojo -->
    <h2 class="subtitulo-rojo">Esto es un encabezado h2</h2>

    <!-- Imagen central de un cuaderno/libreta -->
    <div class="contenedor-imagen">
        <img src="" alt="Cuaderno y lápiz" width="180">
    </div>

    <!-- Párrafo formateado -->
    <p class="parrafo-destacado">
        Esto es un parrafo con un <mark>tamaño de 30px</mark><br>
        y <u>un salto de línea</u>. El estilo utiliza una <strong>fuente verdana</strong>
    </p>

    <hr>
